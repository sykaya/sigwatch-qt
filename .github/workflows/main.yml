name: Build SigWatch

on:
  push:
    branches: [ main, master ]
    paths-ignore:
      - '**.md'
      - 'assets/**'
      - 'LICENSE'
      - '.gitignore'
      - 'docs/**'
      - 'Screenshot/**'
  pull_request:
    branches: [ main, master ]
    paths-ignore:
      - '**.md'
      - 'assets/**'
      - 'LICENSE'
      - '.gitignore'
      - 'docs/**'
      - 'Screenshot/**'

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Qt
      uses: jurplel/install-qt-action@v4
      with:
        version: '6.5.0'
        host: 'windows'
        target: 'desktop'
        arch: 'win64_mingw'
        modules: 'qtmultimedia qtcharts'

    - name: Configure CMake
      run: |
        cmake -B build -S . -DCMAKE_PREFIX_PATH=${{ env.Qt6_DIR }} -DCMAKE_BUILD_TYPE=Release

    - name: Build
      run: |
        cmake --build build --config Release -j 4

    - name: Upload executable
      uses: actions/upload-artifact@v4
      with:
        name: SigWatch-Windows-Package
        path: build/Release/SigWatch.exe

  build-linux:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y cmake build-essential

    - name: Setup Qt
      uses: jurplel/install-qt-action@v4
      with:
        version: '6.5.0'
        host: 'linux'
        target: 'desktop'
        arch: 'gcc_64'
        modules: 'qtmultimedia qtcharts'

    - name: Configure CMake
      run: |
        cmake -B build -S . -DCMAKE_PREFIX_PATH=${{ env.Qt6_DIR }} -DCMAKE_BUILD_TYPE=Release

    - name: Build
      run: |
        cmake --build build --config Release -j $(nproc)

    - name: Upload executable
      uses: actions/upload-artifact@v4
      with:
        name: SigWatch-Linux-Package
        path: build/SigWatch
